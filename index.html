<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="screen-orientation" content="portrait" />
<title>Bot Rush</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --teal: #2fe0c8;
    --teal-dark: #0e8f86;
    --green: #6cf26a;
    --magenta: #ff3fb4;
    --ink: #160f2e;
    --panel: rgba(22, 15, 46, 0.92);
    --font: "Arial Black", "Avenir Next", "Helvetica Neue", Helvetica, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0b0918;
    background-image: radial-gradient(ellipse at 50% 40%, #241a45 0%, #0b0918 70%);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none; font-family: var(--font); color: #fff;
  }
  #frame {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    overflow: hidden; background: #2a1d4f; touch-action: none;
  }
  #frame canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui .interactive { pointer-events: auto; }
  .hidden { display: none !important; }

  /* HUD */
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
  .pill {
    background: rgba(22, 15, 46, 0.72); border: 2px solid rgba(255,255,255,0.18); border-radius: 999px;
    padding: 6px 14px; font-size: 14px; letter-spacing: 1px;
  }
  .pill b { color: var(--teal); }
  #hudCta {
    pointer-events: auto; border: 0; border-radius: 999px; padding: 8px 14px; font: 900 13px var(--font);
    color: var(--ink); background: linear-gradient(#9bff7a, #36d35a); box-shadow: 0 3px 0 #1d8a3a; cursor: pointer;
  }
  .hud-right { display: flex; gap: 8px; align-items: center; }
  #muteBtn {
    pointer-events: auto; width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25);
    background: rgba(22, 15, 46, 0.72); padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #muteBtn svg { width: 20px; height: 20px; }
  #progress {
    position: absolute; top: 58px; left: 50%; transform: translateX(-50%); width: min(70%, 300px);
    display: flex; align-items: center; gap: 6px;
  }
  #progressTrack {
    flex: 1; height: 12px; border-radius: 6px; background: rgba(22, 15, 46, 0.72); border: 2px solid rgba(255,255,255,0.3);
    overflow: hidden;
  }
  #progressFill {
    width: 100%; height: 100%; transform-origin: 0 50%; transform: scaleX(0);
    background: linear-gradient(90deg, #b48cff, #ff5ca8);
  }
  /* the boss icon is the goal: always in colour and pulsing; pops when the boss falls */
  #progressBoss { width: 30px; height: 30px; filter: drop-shadow(0 0 4px rgba(255, 138, 42, 0.9)); animation: bossPulse 1.1s ease-in-out infinite; transition: transform 0.2s; }
  #progressBoss.lit { animation: none; transform: scale(1.35); filter: drop-shadow(0 0 8px #fff6b0) brightness(1.3); }
  @keyframes bossPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  #progressBoss svg { width: 100%; height: 100%; }
  #launcherBadge {
    position: absolute; left: 0; top: 0; transform: translate(-50%, 0); will-change: transform;
    font-size: 15px; padding: 3px 10px; border-radius: 999px; background: rgba(14, 143, 134, 0.85);
    border: 2px solid var(--teal); white-space: nowrap;
  }

  /* Popups */
  .popup {
    position: absolute; left: 0; top: 0; font-size: 22px; font-weight: 900; will-change: transform, opacity;
    color: #b6ff9c; text-shadow: 0 2px 0 #1b5a26, 0 0 8px rgba(0,0,0,0.5); pointer-events: none; white-space: nowrap;
  }
  .popup.bad { color: #ff7b9c; text-shadow: 0 2px 0 #5a1b2c; }
  .popup.big { color: #ffd0f0; font-size: 27px; text-shadow: 0 3px 0 #7a1458, 0 0 10px rgba(255,63,180,0.6); }

  /* Overlays */
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .overlay.dim { background: rgba(10, 6, 24, 0.55); pointer-events: auto; }
  .title {
    font-size: 54px; line-height: 0.95; letter-spacing: 2px; margin: 0 0 6px;
    color: #eafffb; text-shadow: 0 4px 0 var(--teal-dark), 0 8px 18px rgba(0,0,0,0.45);
  }
  .title span { color: var(--green); text-shadow: 0 4px 0 #2b8a2c, 0 8px 18px rgba(0,0,0,0.45); }
  .subtitle { font-size: 16px; opacity: 0.9; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
  #intro { justify-content: flex-start; padding-top: 16%; }
  #introBottom { position: absolute; bottom: 9%; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .hint { font-size: 20px; letter-spacing: 1px; text-shadow: 0 2px 0 rgba(0,0,0,0.6); margin-top: 10px; }
  #hand { width: 64px; height: 64px; animation: handSwipe 1.6s ease-in-out infinite; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5)); }
  #track { width: 160px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.25); margin-bottom: -8px; }
  @keyframes handSwipe { 0%,100% { transform: translateX(-60px) rotate(-8deg); } 50% { transform: translateX(60px) rotate(8deg); } }

  .card {
    background: var(--panel); border: 3px solid rgba(47, 224, 200, 0.55); border-radius: 22px; padding: 22px 20px 18px;
    width: min(88%, 340px); box-shadow: 0 12px 40px rgba(0,0,0,0.5); animation: pop 0.35s cubic-bezier(.2,1.6,.4,1);
  }
  .card h2 { margin: 0 0 4px; font-size: 30px; line-height: 1.05; color: #eafffb; text-shadow: 0 3px 0 var(--teal-dark); }
  .card.fail { border-color: rgba(255, 90, 140, 0.6); }
  .card.fail h2 { text-shadow: 0 3px 0 #8a1d44; }
  .card p { margin: 6px 0 14px; font-size: 15px; opacity: 0.85; font-family: system-ui, sans-serif; font-weight: 700; }
  .stars { font-size: 40px; letter-spacing: 6px; color: #ffd84a; text-shadow: 0 3px 0 #a3711a; margin: 4px 0 6px; }
  .robot-icon { width: 76px; height: 76px; margin: 0 auto 6px; display: block; }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 16px; cursor: pointer; font: 900 22px var(--font);
    padding: 15px 10px; margin-top: 10px; letter-spacing: 1px; pointer-events: auto;
  }
  .btn.primary { color: #10331a; background: linear-gradient(#a8ff86, #34d058); box-shadow: 0 5px 0 #1f8a3b; animation: pulse 1.1s ease-in-out infinite; }
  .btn.secondary { color: #eafffb; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); font-size: 17px; padding: 11px 10px; }
  .btn:active { transform: translateY(3px); }
  .tapnote { font-size: 12px; opacity: 0.6; margin-top: 10px; font-family: system-ui, sans-serif; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
  <div id="frame">
    <div id="ui">
      <div id="hud" class="hidden">
        <div class="pill" id="levelPill">LEVEL <b>1</b>/3</div>
        <div class="hud-right">
          <button id="muteBtn" class="interactive" aria-label="Mute sound">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path id="muteWaves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><path id="muteCross" d="M16 9l6 6M22 9l-6 6" stroke="#ff7b9c" stroke-width="2.4" stroke-linecap="round" style="display:none"/></svg>
          </button>
          <button id="hudCta" class="interactive">GET IT</button>
        </div>
      </div>
      <div id="progress" class="hidden">
        <div id="progressTrack"><div id="progressFill"></div></div>
        <div id="progressBoss" title="boss">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l-2-5 5 3M19 9l2-5-5 3" stroke="#f5ead0" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="12" cy="14" r="8" fill="#ff8a2a"/><circle cx="9" cy="13" r="1.6" fill="#fff6b0"/><circle cx="15" cy="13" r="1.6" fill="#fff6b0"/></svg>
        </div>
      </div>
      <div id="launcherBadge" class="hidden">x1</div>
      <div id="popups"></div>

      <div id="intro" class="overlay">
        <div class="title">BOT<br /><span>RUSH</span></div>
        <div class="subtitle">Grow your bot army. Crush the horde!</div>
        <div id="introBottom">
          <div id="track"></div>
          <svg id="hand" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M26 6c3 0 5 2 5 5v17l2-1c3-1 6 0 7 3l1 1c3-1 6 0 7 3 3-1 6 1 6 4v10c0 9-7 16-16 16h-4c-6 0-10-3-13-8L12 41c-2-3-1-6 2-7 2-1 5 0 6 2l1 2V11c0-3 2-5 5-5z" fill="#fff" stroke="#160f2e" stroke-width="3" stroke-linejoin="round"/>
          </svg>
          <div class="hint">DRAG TO MOVE</div>
        </div>
      </div>

      <div id="endCard" class="overlay dim hidden">
        <div class="card">
          <div class="stars">&#9733;&#9733;&#9733;</div>
          <h2 id="endTitle">LEVEL 1<br />CLEARED!</h2>
          <p id="endText">Your bots crushed the horde.</p>
          <button class="btn primary" id="endDownload">DOWNLOAD</button>
          <button class="btn secondary" id="endContinue">Continue</button>
        </div>
      </div>

      <div id="finalCard" class="overlay dim hidden">
        <div class="card">
          <svg class="robot-icon" viewBox="0 0 80 80" aria-hidden="true">
            <line x1="40" y1="6" x2="40" y2="18" stroke="#eafffb" stroke-width="4"/>
            <circle cx="40" cy="6" r="5" fill="#ffd84a"/>
            <path d="M14 42a26 24 0 0 1 52 0z" fill="#d9fff8"/>
            <rect x="12" y="40" width="56" height="34" rx="16" fill="#2fe0c8"/>
            <rect x="22" y="30" width="36" height="10" rx="5" fill="#160f2e"/>
            <circle cx="32" cy="35" r="3" fill="#6cf26a"/><circle cx="48" cy="35" r="3" fill="#6cf26a"/>
          </svg>
          <h2>ALL LEVELS<br />CLEARED!</h2>
          <p>The full game has 100+ levels and giant bosses.</p>
          <button class="btn primary" id="finalDownload">DOWNLOAD NOW</button>
          <button class="btn secondary" id="finalReplay">Play again</button>
          <div class="tapnote">Tap anywhere to install</div>
        </div>
      </div>

      <div id="failCard" class="overlay dim hidden">
        <div class="card fail">
          <h2>OVERRUN!</h2>
          <p>The horde broke through. Collect more <b>+1</b> gates!</p>
          <button class="btn primary" id="failRetry">RETRY</button>
          <button class="btn secondary" id="failDownload">Download</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
